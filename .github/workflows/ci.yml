name: 毕业项目质量检查
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.22"
          enable-cache: true
      - run: uv sync --locked --project backend
      - run: uv run --project backend ruff check backend scripts tests
      - run: uv run --project backend ruff format --check backend scripts tests
      - run: uv run --project backend python -m pytest backend tests
      - run: uv run --project backend python scripts/check_secrets.py
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend check
      - run: node --test src/response.test.mjs
        working-directory: frontend
