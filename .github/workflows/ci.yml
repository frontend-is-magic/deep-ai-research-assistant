name: 毕业项目质量检查
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: research_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/research_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.22"
          enable-cache: true
      - run: uv sync --locked --project backend
      - run: uv run --project backend ruff check backend scripts tests
      - run: uv run --project backend ruff format --check backend scripts tests
      - run: uv run --project backend python -m pytest backend tests
      - run: uv run --project backend python scripts/check_secrets.py
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend check
      - run: node --test src/response.test.mjs
        working-directory: frontend
      - run: uv run --project backend python scripts/evaluate.py
      - run: pnpm --dir frontend exec playwright install --with-deps chromium
      - run: node scripts/run_headless.mjs
      - run: node scripts/run_headless.mjs
        env:
          RESEARCH_E2E_POSTGRES: "1"
      - run: node scripts/run_privacy_headless.mjs --baseline
      - run: node scripts/run_privacy_headless.mjs
